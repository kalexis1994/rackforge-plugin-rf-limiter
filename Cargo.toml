[workspace]
resolver = "3"
members = [
    "crates/rf-limiter-contract",
    "crates/rf-limiter-dsp",
    "crates/rf-limiter-lab",
    "plugin",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/kalexis1994/rackforge-plugin-rf-limiter"

[workspace.dependencies]
rf-limiter-contract = { path = "crates/rf-limiter-contract" }
rf-limiter-dsp = { path = "crates/rf-limiter-dsp" }
libm = "0.2"

# Portable RackForge ABI used by the processor adapter. Local contributors can
# override this revision with `.cargo/config.toml.example`.
rackforge-plugin-sdk = { git = "https://github.com/kalexis1994/rackforge.git", rev = "1cd7b21c86275c65aec402045f1d3593c3ab812b" }

# The host's own runtime, used by one test: the packaged component must be able
# to start. See crates/rf-limiter-lab/tests/component_instantiates.rs.
rackforge-plugin-runtime = { git = "https://github.com/kalexis1994/rackforge.git", rev = "1cd7b21c86275c65aec402045f1d3593c3ab812b" }
